<script>
/*
  Required JSON URLs:
  1) matches.json  -> match details, logos, time, venue
  2) cricket.json  -> cricket stream links
  3) football.json -> football stream links

  Main rule:
  matches.json ko "stream_id" must match cricket.json / football.json ko key.

  Example:
  matches.json:  "stream_id": "slvsengw"
  cricket.json:  "slvsengw": { "smooth1": "...", "hd1": "..." }
*/

const MATCHES_URL = "https://blogs231.github.io/matchapi/matches.json";

const STREAM_URLS = {
  cricket: "https://blogs231.github.io/matchapi/cricket.json",
  football: "https://blogs231.github.io/matchapi/football.json"
};

/*
  Optional fallback aliases.
  stream_id already added cha bhane yo map compulsory chaina.
  But old matches.json support ko lagi rakheko ho.
*/
const CUSTOM_STREAM_ID_BY_MATCH_ID = {
  engwslw_t20wc_2026_01: "slvsengw",
  canusa_cwcl2_2026_112: "canvsusa",
  slaafga_trination_2026_03: "slaafga",
  indafg_2026_01odi: "indvsafg",
  canbih_fifawc_2026_03: "canbih",
  usapar_fifawc_2026_04: "usapar"
};

const FALLBACK_MATCH_INFO = {

  },

    stream_id: "slaafga",

    teams: {

  },

    teams: {

      away: { name: "Afghanistan", logo: "https://aimages.willow.tv/teamLogos/afghanistan.png" }
    },
    match_info: {
      display_time: "Live / Upcoming",

      status: "vs"
    }
  },

  canbih: {
    title: "Canada vs Bosnia & Herzegovina",
    stream_id: "canbih",
    sport: "football",
    teams: {
      home: { name: "Canada", logo: "https://a.espncdn.com/combiner/i?img=/i/teamlogos/countries/500/can.png" },
      away: { name: "Bosnia & Herzegovina", logo: "https://a.espncdn.com/combiner/i?img=/i/teamlogos/countries/500/bih.png" }
    },
    match_info: {
      display_time: "Live / Upcoming",
      venue: "Live Football",
      status: "vs"
    }
  },

  usapar: {
    title: "United States vs Paraguay",
    stream_id: "usapar",
    sport: "football",
    teams: {
      home: { name: "USA", logo: "https://static.flashscore.com/res/image/data/GpV4Cle5-MPdHoKT3.png" },
      away: { name: "Paraguay", logo: "https://static.flashscore.com/res/image/data/xlHCGmwS-fXkePq9D.png" }
    },
    match_info: {
      display_time: "Live / Upcoming",
      venue: "Live Football",
      status: "vs"
    }
  }
};

const params = new URLSearchParams(window.location.search);

const queryId =
  params.get("id") ||
  params.get("match") ||
  params.get("yosintv") ||
  params.get("mid");

const hero = document.getElementById("hero");
const linksPanel = document.getElementById("linksPanel");
const infoPanel = document.getElementById("infoPanel");
const seoPanel = document.getElementById("seoPanel");
const morePanel = document.getElementById("morePanel");
const faqPanel = document.getElementById("faqPanel");

let allMatches = [];
let currentMatch = null;
let currentStreamId = "";
let currentSport = "cricket";
let streamCache = {};

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function safeUrl(url) {
  try {
    const u = new URL(url, window.location.href);
    if (u.protocol === "http:" || u.protocol === "https:") {
      return u.href;
    }
  } catch (e) {}
  return "#";
}

function slugify(text) {
  return String(text || "")
    .toLowerCase()
    .trim()
    .replace(/&/g, "and")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function shortName(name) {
  const text = String(name || "").trim();

  const custom = {
    "United States of America": "USA",
    "U.S.A.": "USA",
    "USA": "USA",
    "Bosnia & Herzegovina": "BIH",
    "Bosnia and Herzegovina": "BIH",
    "England Women": "ENGW",
    "Sri Lanka Women": "SLW",
    "Sri Lanka A": "SLA",
    "Afghanistan A": "AFGA",
    "New Zealand": "NZ"
  };

  if (custom[text]) return custom[text];

  return text
    .split(/\s+/)
    .filter(Boolean)
    .map(w => w[0])
    .join("")
    .slice(0, 4)
    .toUpperCase();
}

function extractIdFromWatchUrl(url) {
  if (!url || url === "/") return "";

  try {
    const u = new URL(url, window.location.href);

    return (
      u.searchParams.get("id") ||
      u.searchParams.get("match") ||
      u.searchParams.get("yosintv") ||
      u.searchParams.get("mid") ||
      ""
    );
  } catch (e) {
    return "";
  }
}

function getStreamIdFromMatch(match) {
  if (!match) return "";

  return (
    match.stream_id ||
    CUSTOM_STREAM_ID_BY_MATCH_ID[match.match_id] ||
    extractIdFromWatchUrl(match.links && match.links.watch) ||
    ""
  );
}

function getMatchStatus(match) {
  const info = match && match.match_info ? match.match_info : {};

  if (!info.start_time || !info.end_time) {
    return info.display_time || "Live / Upcoming";
  }

  const now = Date.now();
  const start = new Date(info.start_time).getTime();
  const end = new Date(info.end_time).getTime();

  if (!Number.isFinite(start) || !Number.isFinite(end)) {
    return info.display_time || "Live / Upcoming";
  }

  if (now < start) return "Upcoming";
  if (now >= start && now <= end) return "Live Now";
  return "Ended";
}

function formatDateTime(match) {
  const info = match && match.match_info ? match.match_info : {};

  if (!info.start_time) {
    return info.display_time || "Live / Upcoming";
  }

  const d = new Date(info.start_time);

  if (isNaN(d.getTime())) {
    return info.display_time || "Live / Upcoming";
  }

  return d.toLocaleString(undefined, {
    weekday: "short",
    year: "numeric",
    month: "short",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

async function fetchJson(url) {
  const res = await fetch(url, { cache: "no-store" });

  if (!res.ok) {
    throw new Error("Fetch failed: " + url);
  }

  return await res.json();
}

async function loadMatches() {
  const data = await fetchJson(MATCHES_URL);
  allMatches = Array.isArray(data.matches) ? data.matches : [];
}

async function loadStreamJson(sport) {
  if (streamCache[sport]) {
    return streamCache[sport];
  }

  streamCache[sport] = await fetchJson(STREAM_URLS[sport]);
  return streamCache[sport];
}

function findMatch(id) {
  const q = String(id || "").toLowerCase();

  if (!q) return null;

  return allMatches.find(match => String(getStreamIdFromMatch(match) || "").toLowerCase() === q)
    || allMatches.find(match => String(match.match_id || "").toLowerCase() === q)
    || allMatches.find(match => String(match.links && match.links.watch || "").toLowerCase().includes(q))
    || allMatches.find(match => slugify(match.title || "") === q)
    || null;
}

function makeButtonName(key, match) {
  const home = match && match.teams && match.teams.home ? match.teams.home.name : "Team A";
  const away = match && match.teams && match.teams.away ? match.teams.away.name : "Team B";

  const homeShort = shortName(home);
  const awayShort = shortName(away);

  const number = String(key).replace(/\D/g, "");
  const lower = String(key).toLowerCase();

  if (lower.startsWith("android")) return `Android Link ${number || ""} - ${homeShort} vs ${awayShort}`;
  if (lower.startsWith("iphone") || lower.startsWith("ios")) return `iPhone Link ${number || ""} - ${homeShort} vs ${awayShort}`;
  if (lower.startsWith("pc")) return `PC / Android Link ${number || ""} - ${homeShort} vs ${awayShort}`;
  if (lower.startsWith("smooth")) return `Smooth Link ${number || ""} - ${homeShort} vs ${awayShort}`;
  if (lower.startsWith("fhd")) return `FHD Link ${number || ""} - ${homeShort} vs ${awayShort}`;
  if (lower.startsWith("hd")) return `HD Link ${number || ""} - ${homeShort} vs ${awayShort}`;

  return `Watch Link ${number || ""} - ${homeShort} vs ${awayShort}`;
}

function normalizeLinksFromBlock(block, match) {
  if (!block) return [];

  if (Array.isArray(block.events)) {
    return block.events
      .filter(item => item && item.link)
      .map(item => ({
        name: item.name || "Watch Live",
        link: item.link
      }));
  }

  if (Array.isArray(block)) {
    return block
      .filter(item => item && item.link)
      .map(item => ({
        name: item.name || "Watch Live",
        link: item.link
      }));
  }

  if (typeof block === "object") {
    return Object.entries(block)
      .filter(([key, value]) => typeof value === "string" && value.trim())
      .map(([key, value]) => ({
        name: makeButtonName(key, match),
        link: value
      }));
  }

  return [];
}

async function findStreamLinks(streamId, preferredSport) {
  const sportsOrder = preferredSport === "football"
    ? ["football", "cricket"]
    : ["cricket", "football"];

  for (const sport of sportsOrder) {
    try {
      const data = await loadStreamJson(sport);

      if (data && data[streamId]) {
        const links = normalizeLinksFromBlock(data[streamId], currentMatch);
        if (links.length) {
          return { sport, links };
        }
      }

      /*
        Optional support:
        If stream JSON itself is { "events": [...] } instead of keyed by stream_id.
      */
      if (data && Array.isArray(data.events)) {
        const links = normalizeLinksFromBlock(data, currentMatch);
        if (links.length) {
          return { sport, links };
        }
      }
    } catch (e) {}
  }

  return { sport: preferredSport || "cricket", links: [] };
}

function getQualityGroup(name) {
  const n = String(name || "").toLowerCase();

  if (n.includes("telegram")) return "Community";
  if (n.includes("android only")) return "Android Only Links";
  if (n.includes("android link")) return "Android Links";
  if (n.includes("iphone") || n.includes("ios")) return "iPhone Links";
  if (n.includes("pc")) return "PC / Android Links";
  if (n.includes("smooth")) return "Smooth Links";
  if (n.includes("fhd")) return "FHD Links";
  if (n.includes("hd")) return "HD Links";

  return "Other Links";
}

function renderHero(match) {
  const home = match.teams && match.teams.home ? match.teams.home : { name: "Team A", logo: "" };
  const away = match.teams && match.teams.away ? match.teams.away : { name: "Team B", logo: "" };

  const title = match.title || `${home.name} vs ${away.name}`;
  const league = match.match_info && match.match_info.venue
    ? match.match_info.venue
    : "Live Sports Streaming";

  const status = getMatchStatus(match);
  const time = formatDateTime(match);
  const sport = match.sport || currentSport || "sports";

  document.title = `${home.name} vs ${away.name} Live Streaming - KasinTV`;

  document.querySelector("meta[name='description']").setAttribute(
    "content",
    `Watch ${home.name} vs ${away.name} live streaming online on KasinTV with HD, FHD and smooth match links.`
  );

  hero.innerHTML = `
    <div class="live-pill"><span class="dot"></span> ${esc(status)}</div>

    <div class="match-teams">
      <div class="team">
        ${
          home.logo
          ? `<img class="team-logo" src="${safeUrl(home.logo)}" alt="${esc(home.name)}" onerror="this.outerHTML='<div class=&quot;logo-text&quot;>${esc(shortName(home.name))}</div>'">`
          : `<div class="logo-text">${esc(shortName(home.name))}</div>`
        }
        <h2>${esc(home.name)}</h2>
      </div>

      <div class="vs">VS</div>

      <div class="team">
        ${
          away.logo
          ? `<img class="team-logo" src="${safeUrl(away.logo)}" alt="${esc(away.name)}" onerror="this.outerHTML='<div class=&quot;logo-text&quot;>${esc(shortName(away.name))}</div>'">`
          : `<div class="logo-text">${esc(shortName(away.name))}</div>`
        }
        <h2>${esc(away.name)}</h2>
      </div>
    </div>

    <div class="league">${esc(title)}</div>

    <div class="meta-grid">
      <div class="meta">
        <small>Match Time</small>
        <b>${esc(time)}</b>
      </div>

      <div class="meta">
        <small>Sport</small>
        <b>${esc(String(sport).toUpperCase())}</b>
      </div>

      <div class="meta">
        <small>Status</small>
        <b>${esc(status)}</b>
      </div>
    </div>
  `;
}

function renderLinks(links, match) {
  if (!links.length) {
    linksPanel.innerHTML = `
      <div class="error">
        No stream links found for ID: ${esc(currentStreamId)}.
        Check cricket.json / football.json key name.
      </div>
    `;
    return;
  }

  const groups = {};

  links.forEach(item => {
    const group = getQualityGroup(item.name);
    if (!groups[group]) groups[group] = [];
    groups[group].push(item);
  });

  const groupOrder = [
    "Community",
    "Android Only Links",
    "Android Links",
    "iPhone Links",
    "PC / Android Links",
    "Smooth Links",
    "HD Links",
    "FHD Links",
    "Other Links"
  ];

  const home = match.teams && match.teams.home ? match.teams.home.name : "Team A";
  const away = match.teams && match.teams.away ? match.teams.away.name : "Team B";

  let html = `
    <div class="section-title">
      <h2>Live Stream Links</h2>
      <span>${esc(shortName(home))} vs ${esc(shortName(away))}</span>
    </div>

    <p class="note">
      Choose any available link below. If one stream is slow, buffering or not opening,
      return to this page and try another backup link.
    </p>
  `;

  groupOrder.forEach(group => {
    if (!groups[group]) return;

    html += `<div class="group-name">${esc(group)}</div>`;

    groups[group].forEach(item => {
      html += `
        <a class="stream-btn"
           href="${safeUrl(item.link)}"
           target="_blank"
           rel="noopener noreferrer">
          <span>${esc(item.name)}</span>
          <small>Open</small>
        </a>
      `;
    });
  });

  linksPanel.innerHTML = html;
}

function renderInfo(match) {
  const info = match.match_info || {};
  const home = match.teams && match.teams.home ? match.teams.home.name : "Team A";
  const away = match.teams && match.teams.away ? match.teams.away.name : "Team B";

  infoPanel.innerHTML = `
    <div class="section-title">
      <h2>Match Details</h2>
      <span>${esc(match.sport || currentSport)}</span>
    </div>

    <div class="info-table">
      <div class="info-row">
        <span>Title</span>
        <b>${esc(match.title || `${home} vs ${away}`)}</b>
      </div>

      <div class="info-row">
        <span>Start Time</span>
        <b>${esc(formatDateTime(match))}</b>
      </div>

      <div class="info-row">
        <span>Venue</span>
        <b>${esc(info.venue || "Not available")}</b>
      </div>

      <div class="info-row">
        <span>Stream ID</span>
        <b>${esc(currentStreamId)}</b>
      </div>
    </div>
  `;
}

function renderSeo(match) {
  const home = match.teams && match.teams.home ? match.teams.home.name : "Team A";
  const away = match.teams && match.teams.away ? match.teams.away.name : "Team B";
  const sport = match.sport || currentSport || "sports";

  seoPanel.innerHTML = `
    <h2>${esc(home)} vs ${esc(away)} Live Streaming</h2>

    <p>
      Watch ${esc(home)} vs ${esc(away)} live streaming online on KasinTV with multiple
      smooth, HD, FHD, Android, iPhone and PC match links. This page is created for fans
      who want a clean, fast and mobile-friendly way to access live ${esc(sport)} coverage.
    </p>

    <p>
      KasinTV provides different stream options because live match traffic can become high
      during important moments. If one link is slow, buffering or not opening, viewers can
      return to this page and try another available backup link.
    </p>

    <h3>How to Watch ${esc(home)} vs ${esc(away)} Live Online</h3>

    <p>
      Scroll to the live links section and click any available button. Smooth links are useful
      for slower internet, HD links are good for normal Wi-Fi, and FHD links are better for
      viewers who want clearer quality with stable internet.
    </p>

    <h3>${esc(home)} vs ${esc(away)} Match Coverage</h3>

    <p>
      Fans searching for ${esc(home)} vs ${esc(away)} live, ${esc(home)} vs ${esc(away)}
      HD streaming, online match coverage and live sports links can use this page as a quick
      access hub.
    </p>
  `;
}

function renderMoreMatches() {
  let html = `
    <div class="section-title">
      <h2>More Matches</h2>
      <span>${allMatches.length} total</span>
    </div>

    <div class="more-list">
  `;

  let count = 0;

  allMatches.forEach(match => {
    const streamId = getStreamIdFromMatch(match);

    if (!streamId || streamId === currentStreamId) return;

    const home = match.teams && match.teams.home ? match.teams.home.name : "Team A";
    const away = match.teams && match.teams.away ? match.teams.away.name : "Team B";

    count++;

    html += `
      <a class="more-item" href="${location.pathname}?id=${encodeURIComponent(streamId)}">
        <span>${esc(home)} vs ${esc(away)}</span>
        <small>${esc(match.sport || "sports")}</small>
      </a>
    `;
  });

  if (!count) {
    html += `<p class="note">No more stream-ready matches available.</p>`;
  }

  html += `</div>`;

  morePanel.innerHTML = html;
}

function renderFaq(match) {
  const home = match.teams && match.teams.home ? match.teams.home.name : "Team A";
  const away = match.teams && match.teams.away ? match.teams.away.name : "Team B";

  faqPanel.innerHTML = `
    <div class="section-title">
      <h2>FAQs</h2>
      <span>Help</span>
    </div>

    <details open>
      <summary>Which link should I open?</summary>
      <p>
        Use Smooth links for slow internet, HD links for normal internet, and FHD links for
        better quality. Android, iPhone and PC links may work differently depending on device.
      </p>
    </details>

    <details>
      <summary>What if one link does not work?</summary>
      <p>
        Return to this page and try another backup link. Different links may work better on
        different browsers, networks and devices.
      </p>
    </details>

    <details>
      <summary>Can I watch ${esc(home)} vs ${esc(away)} on mobile?</summary>
      <p>
        Yes, this page works on Android, iPhone, tablet, laptop and desktop browsers.
      </p>
    </details>
  `;
}

async function init() {
  if (!queryId) {
    linksPanel.innerHTML = `
      <div class="error">
        Match ID missing. Example: match.html?id=slvsengw
      </div>
    `;
    infoPanel.innerHTML = "";
    seoPanel.innerHTML = "";
    morePanel.innerHTML = "";
    faqPanel.innerHTML = "";
    return;
  }

  try {
    await loadMatches();

    currentMatch = findMatch(queryId);

    if (currentMatch) {
      currentStreamId = getStreamIdFromMatch(currentMatch) || queryId;
      currentSport = currentMatch.sport || "cricket";
    } else {
      currentStreamId = queryId;
      currentMatch = FALLBACK_MATCH_INFO[currentStreamId] || {
        title: currentStreamId.toUpperCase() + " Live Match",
        stream_id: currentStreamId,
        sport: "cricket",
        teams: {
          home: { name: "Team A", logo: "" },
          away: { name: "Team B", logo: "" }
        },
        match_info: {
          display_time: "Live / Upcoming",
          venue: "Live Sports",
          status: "vs"
        }
      };
      currentSport = currentMatch.sport || "cricket";
    }

    renderHero(currentMatch);

    const result = await findStreamLinks(currentStreamId, currentSport);

    currentSport = result.sport;
    currentMatch.sport = currentMatch.sport || currentSport;

    renderLinks(result.links, currentMatch);
    renderInfo(currentMatch);
    renderSeo(currentMatch);
    renderMoreMatches();
    renderFaq(currentMatch);

  } catch (error) {
    linksPanel.innerHTML = `
      <div class="error">
        Failed to load API. Check matches.json, cricket.json, football.json URL or CORS.
      </div>
    `;
    infoPanel.innerHTML = "";
    seoPanel.innerHTML = "";
    morePanel.innerHTML = "";
    faqPanel.innerHTML = "";
  }
}

init();
</script>

</html>
