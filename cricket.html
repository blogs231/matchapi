<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>KasinTV Live Match</title>
  <meta name="description" content="Watch live cricket and football matches on KasinTV with Android, iPhone, PC, HD and smooth streaming links." />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top left, rgba(37,99,235,.35), transparent 35%),
        radial-gradient(circle at top right, rgba(124,58,237,.25), transparent 35%),
        #050816;
      color: #f8fafc;
    }

    a {
      text-decoration: none;
    }

    .topbar {
      background: rgba(5, 8, 22, .88);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255,255,255,.08);
      padding: 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .nav {
      max-width: 920px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 25px;
      font-weight: 900;
      color: white;
    }

    .brand span {
      color: #38bdf8;
    }

    .nav-badge {
      font-size: 12px;
      color: #bae6fd;
      background: rgba(14,165,233,.15);
      border: 1px solid rgba(125,211,252,.2);
      padding: 7px 13px;
      border-radius: 999px;
      font-weight: 700;
    }

    .container {
      max-width: 920px;
      margin: 36px auto;
      padding: 0 16px;
    }

    .hero {
      position: relative;
      overflow: hidden;
      border-radius: 30px;
      padding: 28px;
      background:
        linear-gradient(135deg, rgba(37,99,235,.98), rgba(124,58,237,.92)),
        radial-gradient(circle at 90% 0%, rgba(255,255,255,.25), transparent 35%);
      box-shadow: 0 25px 70px rgba(0,0,0,.35);
      margin-bottom: 24px;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(255,255,255,.12);
      top: -85px;
      right: -65px;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #ef4444;
      color: white;
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      margin-bottom: 18px;
      position: relative;
      z-index: 2;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      animation: blink 1s infinite;
    }

    @keyframes blink {
      50% { opacity: .35; }
    }

    .match-teams {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 18px;
      position: relative;
      z-index: 2;
    }

    .team {
      text-align: center;
    }

    .team img {
      width: 76px;
      height: 76px;
      object-fit: contain;
      background: rgba(255,255,255,.12);
      padding: 10px;
      border-radius: 22px;
      border: 1px solid rgba(255,255,255,.16);
    }

    .team h2 {
      margin: 10px 0 0;
      font-size: 20px;
      line-height: 1.2;
    }

    .vs {
      font-size: 38px;
      font-weight: 1000;
      color: #fde68a;
      text-shadow: 0 3px 18px rgba(0,0,0,.25);
    }

    .league {
      margin-top: 20px;
      position: relative;
      z-index: 2;
      background: rgba(255,255,255,.13);
      border: 1px solid rgba(255,255,255,.18);
      padding: 13px;
      border-radius: 18px;
      color: #e0f2fe;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 16px;
      position: relative;
      z-index: 2;
    }

    .meta {
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.17);
      border-radius: 16px;
      padding: 13px;
    }

    .meta small {
      display: block;
      color: #bfdbfe;
      font-size: 11px;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }

    .meta b {
      font-size: 14px;
    }

    .panel {
      background: rgba(15,23,42,.88);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 26px;
      padding: 24px;
      box-shadow: 0 18px 55px rgba(0,0,0,.25);
      margin-bottom: 22px;
    }

    .section-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-bottom: 14px;
    }

    .section-title h2 {
      margin: 0;
      font-size: 24px;
    }

    .section-title span {
      font-size: 12px;
      color: #93c5fd;
      background: rgba(37,99,235,.14);
      padding: 6px 10px;
      border-radius: 999px;
    }

    .note {
      color: #cbd5e1;
      line-height: 1.75;
      font-size: 15px;
      margin-bottom: 22px;
    }

    .group-name {
      color: #7dd3fc;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .7px;
      font-weight: 900;
      margin: 20px 0 9px;
    }

    .stream-btn {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      color: white;
      padding: 17px 18px;
      border-radius: 18px;
      margin: 10px 0;
      font-size: 15px;
      font-weight: 900;
      background: linear-gradient(90deg, #2563eb, #4f46e5);
      border: 1px solid rgba(255,255,255,.12);
      transition: .2s;
    }

    .stream-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(37,99,235,.34);
    }

    .stream-btn.telegram {
      background: linear-gradient(90deg, #0284c7, #0ea5e9);
    }

    .stream-btn small {
      color: #dbeafe;
      font-size: 12px;
    }

    .seo {
      color: #d1d5db;
      line-height: 1.9;
      font-size: 15px;
    }

    .seo h2 {
      color: white;
      font-size: 29px;
      margin: 0 0 12px;
    }

    .seo h3 {
      color: white;
      font-size: 21px;
      margin-top: 28px;
      margin-bottom: 8px;
    }

    .info-table {
      display: grid;
      gap: 10px;
      margin-top: 16px;
    }

    .info-row {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      padding: 13px 14px;
      border-radius: 15px;
    }

    .info-row span {
      color: #94a3b8;
      font-size: 13px;
    }

    .info-row b {
      text-align: right;
      color: white;
      font-size: 13px;
    }

    .lineups {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 16px;
    }

    .lineup-box {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 18px;
      padding: 16px;
    }

    .lineup-box h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .lineup-box ul {
      margin: 0;
      padding-left: 18px;
      color: #cbd5e1;
      line-height: 1.8;
      font-size: 14px;
    }

    .more-list {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }

    .more-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      color: white;
      border-radius: 16px;
      padding: 15px;
      font-weight: 800;
    }

    .more-item small {
      color: #93c5fd;
      font-size: 12px;
    }

    .faq details {
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 15px;
      margin: 10px 0;
    }

    .faq summary {
      cursor: pointer;
      font-weight: 900;
      color: white;
    }

    .faq p {
      color: #cbd5e1;
      line-height: 1.75;
      margin-bottom: 0;
    }

    .error {
      background: rgba(239,68,68,.15);
      border: 1px solid rgba(239,68,68,.35);
      padding: 18px;
      border-radius: 18px;
      color: #fecaca;
      text-align: center;
      font-weight: 900;
    }

    footer {
      text-align: center;
      padding: 30px;
      color: #94a3b8;
      font-size: 13px;
    }

    @media(max-width: 700px) {
      .container {
        margin-top: 22px;
      }

      .hero {
        padding: 22px;
        border-radius: 24px;
      }

      .match-teams {
        gap: 10px;
      }

      .team img {
        width: 58px;
        height: 58px;
        border-radius: 18px;
      }

      .team h2 {
        font-size: 15px;
      }

      .vs {
        font-size: 28px;
      }

      .meta-grid {
        grid-template-columns: 1fr;
      }

      .section-title {
        display: block;
      }

      .section-title span {
        display: inline-block;
        margin-top: 8px;
      }

      .panel {
        padding: 18px;
      }

      .lineups {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header class="topbar">
  <div class="nav">
    <div class="brand">KaSin<span>TV</span></div>
    <div class="nav-badge">Live Sports</div>
  </div>
</header>

<main class="container">

  <section class="hero" id="hero">
    <div class="live-pill"><span class="dot"></span> LOADING</div>
    <div class="match-teams">
      <div class="team">
        <img alt="" />
        <h2>Team A</h2>
      </div>
      <div class="vs">VS</div>
      <div class="team">
        <img alt="" />
        <h2>Team B</h2>
      </div>
    </div>
  </section>

  <section class="panel" id="linksPanel">
    Loading match links...
  </section>

  <section class="panel seo" id="seoPanel"></section>

  <section class="panel" id="insightPanel"></section>

  <section class="panel" id="morePanel"></section>

  <section class="panel faq" id="faqPanel"></section>

</main>

<footer>
  © KaSinTV Live Sports Streaming
</footer>

<script>
/*
  Example:
  https://blogs231.github.io/matchapi/match-football.json
  https://blogs231.github.io/matchapi/match-cricket.json
*/

const MATCH_APIS = [
  {
    sport: "football",
    url: "https://YOUR-DOMAIN.com/api/match-football.json"
  },
  {
    sport: "cricket",
    url: "https://YOUR-DOMAIN.com/api/match-cricket.json"
  }
];

const params = new URLSearchParams(window.location.search);

/*
  Supported URLs:
  match.html?id=canada
  match.html?match=canada
  match.html?yosintv=canada
*/
const pageSlug =
  params.get("id") ||
  params.get("match") ||

const hero = document.getElementById("hero");
const linksPanel = document.getElementById("linksPanel");
const seoPanel = document.getElementById("seoPanel");
const insightPanel = document.getElementById("insightPanel");
const morePanel = document.getElementById("morePanel");
const faqPanel = document.getElementById("faqPanel");

let allMatches = [];
let currentMatch = null;

function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function safeUrl(url) {
  try {
    const u = new URL(url, window.location.href);
    if (u.protocol === "http:" || u.protocol === "https:") {
      return u.href;
    }
  } catch (e) {}
  return "#";
}

function slugify(text) {
  return String(text || "")
    .toLowerCase()
    .trim()
    .replace(/&/g, "and")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function getSlugFromUrl(url) {
  try {
    const u = new URL(url);
    return (
      u.searchParams.get("id") ||
      u.searchParams.get("match") ||
      u.searchParams.get("yosintv") ||
      ""
    );
  } catch (e) {
    return "";
  }
}

function getSlugFromStreamingUrl(url) {
  try {
    const u = new URL(url);
    const file = u.pathname.split("/").pop() || "";
    return file.replace(".json", "");
  } catch (e) {
    return "";
  }
}

function getMatchSlug(match) {
  return (
    getSlugFromUrl(match.details_url) ||
    getSlugFromStreamingUrl(match.streaming_url) ||
    slugify(`${match.team1}-${match.team2}`)
  );
}

async function fetchJson(url) {
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error("Failed to fetch: " + url);
  return await res.json();
}

async function loadAllMatches() {
  const results = await Promise.allSettled(
    MATCH_APIS.map(async api => {
      const data = await fetchJson(api.url);
      const matches = Array.isArray(data.matches) ? data.matches : [];
      return matches.map(match => ({
        ...match,
        sport_type: api.sport
      }));
    })
  );

  allMatches = results
    .filter(r => r.status === "fulfilled")
    .flatMap(r => r.value);
}

function getLocalTime(dateString) {
  if (!dateString) return "Live / Upcoming";

  const d = new Date(dateString);
  if (isNaN(d.getTime())) return "Live / Upcoming";

  return d.toLocaleString(undefined, {
    weekday: "short",
    year: "numeric",
    month: "short",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

function getMatchStatus(match) {
  if (!match.start) return "Live / Upcoming";

  const start = new Date(match.start).getTime();
  if (!Number.isFinite(start)) return "Live / Upcoming";

  const durationHours = Number(match.duration || 3);
  const end = start + durationHours * 60 * 60 * 1000;
  const now = Date.now();

  if (now < start) return "Starts Soon";
  if (now >= start && now <= end) return "Live Now";
  return "Ended";
}

function renderHero(match) {
  const team1 = esc(match.team1 || "Team A");
  const team2 = esc(match.team2 || "Team B");
  const logo1 = safeUrl(match.team1_logo || "");
  const logo2 = safeUrl(match.team2_logo || "");
  const league = esc(match.league || "Live Sports");
  const time = esc(getLocalTime(match.start));
  const sport = esc((match.sport_type || "sports").toUpperCase());
  const status = esc(getMatchStatus(match));

  document.title = `${team1} vs ${team2} Live Streaming - KasinTV`;

  document.querySelector("meta[name='description']").setAttribute(
    "content",
    `Watch ${team1} vs ${team2} live streaming online on KasinTV with Android, iPhone, PC, HD and smooth stream links.`
  );

  hero.innerHTML = `
    <div class="live-pill"><span class="dot"></span> ${status}</div>

    <div class="match-teams">
      <div class="team">
        <img src="${logo1}" alt="${team1}" onerror="this.style.display='none'">
        <h2>${team1}</h2>
      </div>

      <div class="vs">VS</div>

      <div class="team">
        <img src="${logo2}" alt="${team2}" onerror="this.style.display='none'">
        <h2>${team2}</h2>
      </div>
    </div>

    <div class="league">${league}</div>

    <div class="meta-grid">
      <div class="meta">
        <small>Match Time</small>
        <b>${time}</b>
      </div>
      <div class="meta">
        <small>Sport</small>
        <b>${sport}</b>
      </div>
      <div class="meta">
        <small>Status</small>
        <b>${status}</b>
      </div>
    </div>
  `;
}

function getEventGroup(name) {
  const n = String(name || "").toLowerCase();

  if (n.includes("telegram")) return "Join Community";
  if (n.includes("android only")) return "Android Only Links";
  if (n.includes("iphone") || n.includes("ios")) return "iPhone Links";
  if (n.includes("pc") || n.includes("android")) return "PC / Android Links";
  if (n.includes("hd")) return "HD Links";
  if (n.includes("fhd")) return "FHD Links";

  return "Other Links";
}

function renderStreamButtons(events) {
  if (!Array.isArray(events) || events.length === 0) {
    linksPanel.innerHTML = `
      <div class="error">No streaming links found for this match.</div>
    `;
    return;
  }

  const groups = {};

  events.forEach(event => {
    const group = getEventGroup(event.name);
    if (!groups[group]) groups[group] = [];
    groups[group].push(event);
  });

  let html = `
    <div class="section-title">
      <h2>Live Stream Links</h2>
      <span>${esc(currentMatch.team1)} vs ${esc(currentMatch.team2)}</span>
    </div>

    <p class="note">
      Choose any available link below. If one link is slow, buffering, blocked or not opening,
      return to this page and try another backup link.
    </p>
  `;

  Object.keys(groups).forEach(groupName => {
    html += `<div class="group-name">${esc(groupName)}</div>`;

    groups[groupName].forEach(event => {
      const isTelegram = String(event.name || "").toLowerCase().includes("telegram");

      html += `
        <a class="stream-btn ${isTelegram ? "telegram" : ""}"
           href="${safeUrl(event.link)}"
           target="_blank"
           rel="noopener noreferrer">
          <span>${esc(event.name)}</span>
          <small>Open</small>
        </a>
      `;
    });
  });

  linksPanel.innerHTML = html;
}

async function loadStreamingLinks(match) {
  if (!match.streaming_url) {
    linksPanel.innerHTML = `<div class="error">Streaming URL missing for this match.</div>`;
    return;
  }

  try {
    linksPanel.innerHTML = "Loading live links...";
    const streamData = await fetchJson(match.streaming_url);
    renderStreamButtons(streamData.events || []);
  } catch (e) {
    linksPanel.innerHTML = `
      <div class="error">
        Failed to load streaming links. Check streaming_url or CORS setting.
      </div>
    `;
  }
}

function renderSeo(match) {
  const team1 = esc(match.team1 || "Team A");
  const team2 = esc(match.team2 || "Team B");
  const sport = esc(match.sport_type || "sports");
  const league = esc(match.league || "Live Sports");

  seoPanel.innerHTML = `
    <h2>${team1} vs ${team2} Live Streaming</h2>

    <p>
      Watch ${team1} vs ${team2} live streaming online on KasinTV with multiple
      Android, iPhone, PC, smooth, HD and backup match links. This page is created
      for sports fans who want a simple and fast way to access live ${sport} coverage
      without searching through many pages.
    </p>

    <p>
      KasinTV provides different stream options because live match traffic can become
      very high during important moments. If one link is slow, buffering or not opening,
      viewers can return to this page and try another available option.
    </p>

    <h3>How to Watch ${team1} vs ${team2} Live Online</h3>

    <p>
      To watch ${team1} vs ${team2} live online, scroll to the live links section and
      click any available button. Android links are useful for mobile users, iPhone links
      are useful for iOS users, and PC links are better for desktop or laptop browsers.
    </p>

    <p>
      For the best experience, use an updated browser such as Chrome, Safari, Edge or
      Firefox. Keep your internet stable and try another link if the first one does not
      work properly.
    </p>

    <h3>${team1} vs ${team2} Match Coverage</h3>

    <p>
      Fans searching for ${team1} vs ${team2} live, ${team1} vs ${team2} HD streaming,
      ${team1} vs ${team2} online match, ${team1} vs ${team2} mobile stream and
      ${league} live coverage can use this page as a quick match access hub.
    </p>
  `;
}

function renderInsights(match) {
  const data = match.football_data || match.cricket_data || null;

  let html = `
    <div class="section-title">
      <h2>Match Insights</h2>
      <span>${esc(match.sport_type || "sports")}</span>
    </div>
  `;

  if (!data) {
    html += `<p class="note">Detailed match insights are not available for this match yet.</p>`;
    insightPanel.innerHTML = html;
    return;
  }

  const event = data.event || {};
  const h2h = data.h2h || {};
  const lineups = data.lineups || {};

  html += `<div class="info-table">`;

  if (event.venue) {
    html += `<div class="info-row"><span>Venue</span><b>${esc(event.venue)}</b></div>`;
  }

  if (event.stadium_capacity) {
    html += `<div class="info-row"><span>Stadium Capacity</span><b>${esc(event.stadium_capacity)}</b></div>`;
  }

  if (event.referee) {
    html += `<div class="info-row"><span>Referee</span><b>${esc(event.referee)}</b></div>`;
  }

  if (event.home_manager) {
    html += `<div class="info-row"><span>Home Manager</span><b>${esc(event.home_manager)}</b></div>`;
  }

  if (event.away_manager) {
    html += `<div class="info-row"><span>Away Manager</span><b>${esc(event.away_manager)}</b></div>`;
  }

  if (typeof h2h.homeWins !== "undefined") {
    html += `<div class="info-row"><span>Head to Head</span><b>${esc(h2h.homeWins)} - ${esc(h2h.draws)} - ${esc(h2h.awayWins)}</b></div>`;
  }

  html += `</div>`;

  const homePlayers = Array.isArray(lineups.home_players) ? lineups.home_players : [];
  const awayPlayers = Array.isArray(lineups.away_players) ? lineups.away_players : [];

  if (homePlayers.length || awayPlayers.length) {
    html += `
      <div class="lineups">
        <div class="lineup-box">
          <h3>${esc(match.team1)} Lineup</h3>
          <ul>
            ${homePlayers.length ? homePlayers.map(p => `<li>${esc(p)}</li>`).join("") : "<li>Not available yet</li>"}
          </ul>
        </div>

        <div class="lineup-box">
          <h3>${esc(match.team2)} Lineup</h3>
          <ul>
            ${awayPlayers.length ? awayPlayers.map(p => `<li>${esc(p)}</li>`).join("") : "<li>Not available yet</li>"}
          </ul>
        </div>
      </div>
    `;
  }

  insightPanel.innerHTML = html;
}

function renderMoreMatches() {
  const others = allMatches
    .filter(m => getMatchSlug(m) !== getMatchSlug(currentMatch))
    .slice(0, 12);

  let html = `
    <div class="section-title">
      <h2>More Matches</h2>
      <span>${others.length} available</span>
    </div>
    <div class="more-list">
  `;

  if (!others.length) {
    html += `<p class="note">No more matches available right now.</p>`;
  } else {
    others.forEach(match => {
      const slug = getMatchSlug(match);
      const url = `match.html?id=${encodeURIComponent(slug)}`;

      html += `
        <a class="more-item" href="${url}">
          <span>${esc(match.team1)} vs ${esc(match.team2)}</span>
          <small>${esc(match.sport_type || "sports")}</small>
        </a>
      `;
    });
  }

  html += `</div>`;
  morePanel.innerHTML = html;
}

function renderFaq(match) {
  const team1 = esc(match.team1 || "Team A");
  const team2 = esc(match.team2 || "Team B");

  faqPanel.innerHTML = `
    <div class="section-title">
      <h2>FAQs</h2>
      <span>Help</span>
    </div>

    <details open>
      <summary>Which link should I open?</summary>
      <p>
        Android users can try Android links, iPhone users can try iPhone links,
        and desktop users can try PC links. If one link is slow, try another backup link.
      </p>
    </details>

    <details>
      <summary>Why is the stream buffering?</summary>
      <p>
        Buffering can happen because of high traffic, slow internet or server load.
        Try another link or use a stable Wi-Fi connection.
      </p>
    </details>

    <details>
      <summary>Can I watch ${team1} vs ${team2} on mobile?</summary>
      <p>
        Yes, this page is responsive and works on Android, iPhone, tablet, laptop
        and desktop browsers.
      </p>
    </details>
  `;
}

async function init() {
  if (!pageSlug) {
    linksPanel.innerHTML = `
      <div class="error">
        Match ID missing. Example: match.html?id=canada
      </div>
    `;
    seoPanel.innerHTML = "";
    insightPanel.innerHTML = "";
    morePanel.innerHTML = "";
    faqPanel.innerHTML = "";
    return;
  }

  try {
    await loadAllMatches();

    currentMatch = allMatches.find(match => {
      return getMatchSlug(match).toLowerCase() === pageSlug.toLowerCase();
    });

    if (!currentMatch) {
      linksPanel.innerHTML = `
        <div class="error">
          Match not found. Check your match API JSON and URL slug.
        </div>
      `;
      seoPanel.innerHTML = "";
      insightPanel.innerHTML = "";
      morePanel.innerHTML = "";
      faqPanel.innerHTML = "";
      return;
    }

    renderHero(currentMatch);
    await loadStreamingLinks(currentMatch);
    renderSeo(currentMatch);
    renderInsights(currentMatch);
    renderMoreMatches();
    renderFaq(currentMatch);

  } catch (e) {
    linksPanel.innerHTML = `
      <div class="error">
        Failed to load match API. Check MATCH_APIS URLs.
      </div>
    `;
  }
}

init();
</script>

</body>
</html>
