<script>
// ===== CONFIGURATION =====
const MATCHES_URL = "https://matchapi.pages.dev/matches.json";

const STREAM_URLS = {
  cricket: "https://matchapi.pages.dev/cricket.json",
  football: "https://matchapi.pages.dev/football.json"
};

// Fallback stream IDs mapping (if not found in matches.json)
const CUSTOM_STREAM_ID_BY_MATCH_ID = {
  // Add custom mappings here if needed
};

// Fallback match info when match not found
const FALLBACK_MATCH_INFO = {
  // Add fallback match info here if needed
};

// ===== DOM ELEMENTS =====
const params = new URLSearchParams(window.location.search);
const queryId = params.get("id") || params.get("match") || "";

const hero = document.getElementById("hero");
const linksPanel = document.getElementById("linksPanel");
const infoPanel = document.getElementById("infoPanel");
const seoPanel = document.getElementById("seoPanel");
const morePanel = document.getElementById("morePanel");
const faqPanel = document.getElementById("faqPanel");

// ===== STATE =====
let allMatches = [];
let currentMatch = null;
let currentStreamId = "";
let currentSport = "cricket";
let streamCache = {};

// ===== UTILITY FUNCTIONS =====
function esc(value) {
  return String(value ?? "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");
}

function safeUrl(url) {
  try {
    const u = new URL(url, window.location.href);
    if (u.protocol === "http:" || u.protocol === "https:") {
      return u.href;
    }
  } catch (e) {}
  return "#";
}

function slugify(text) {
  return String(text || "")
    .toLowerCase()
    .trim()
    .replace(/&/g, "and")
    .replace(/[^a-z0-9]+/g, "-")
    .replace(/^-+|-+$/g, "");
}

function shortName(name) {
  const text = String(name || "").trim();

  const custom = {
    "United States of America": "USA",
    "U.S.A.": "USA",
    "USA": "USA",
    "Bosnia & Herzegovina": "BIH",
    "Bosnia and Herzegovina": "BIH",
    "England Women": "ENGW",
    "Sri Lanka Women": "SLW",
    "Sri Lanka A": "SLA",
    "Afghanistan A": "AFGA",
    "New Zealand": "NZ"
  };

  if (custom[text]) return custom[text];

  return text
    .split(/\s+/)
    .filter(Boolean)
    .map(w => w[0])
    .join("")
    .slice(0, 4)
    .toUpperCase();
}

function extractIdFromWatchUrl(url) {
  if (!url || url === "/") return "";

  try {
    const u = new URL(url, window.location.href);
    return (
      u.searchParams.get("id") ||
      u.searchParams.get("match") ||
      ""
    );
  } catch (e) {
    return "";
  }
}

function getStreamIdFromMatch(match) {
  if (!match) return "";

  return (
    match.stream_id ||
    CUSTOM_STREAM_ID_BY_MATCH_ID[match.match_id] ||
    extractIdFromWatchUrl(match.links && match.links.watch) ||
    ""
  );
}

function getMatchStatus(match) {
  const info = match && match.match_info ? match.match_info : {};

  if (!info.start_time || !info.end_time) {
    return info.display_time || "Live / Upcoming";
  }

  const now = Date.now();
  const start = new Date(info.start_time).getTime();
  const end = new Date(info.end_time).getTime();

  if (!Number.isFinite(start) || !Number.isFinite(end)) {
    return info.display_time || "Live / Upcoming";
  }

  if (now < start) return "Upcoming";
  if (now >= start && now <= end) return "Live Now";
  return "Ended";
}

function formatDateTime(match) {
  const info = match && match.match_info ? match.match_info : {};

  if (!info.start_time) {
    return info.display_time || "Live / Upcoming";
  }

  const d = new Date(info.start_time);

  if (isNaN(d.getTime())) {
    return info.display_time || "Live / Upcoming";
  }

  return d.toLocaleString(undefined, {
    weekday: "short",
    year: "numeric",
    month: "short",
    day: "2-digit",
    hour: "2-digit",
    minute: "2-digit"
  });
}

// ===== API FUNCTIONS =====
async function fetchJson(url) {
  const res = await fetch(url, { cache: "no-store" });

  if (!res.ok) {
    throw new Error("Fetch failed: " + url);
  }

  return await res.json();
}

async function loadMatches() {
  try {
    const data = await fetchJson(MATCHES_URL);
    allMatches = Array.isArray(data.matches) ? data.matches : [];
  } catch (error) {
    console.error("Failed to load matches:", error);
    allMatches = [];
  }
}

async function loadStreamJson(sport) {
  if (streamCache[sport]) {
    return streamCache[sport];
  }

  try {
    streamCache[sport] = await fetchJson(STREAM_URLS[sport]);
    return streamCache[sport];
  } catch (error) {
    console.error("Failed to load stream data for sport:", sport, error);
    return {};
  }
}

function findMatch(id) {
  const q = String(id || "").toLowerCase();

  if (!q) return null;

  return allMatches.find(match => String(getStreamIdFromMatch(match) || "").toLowerCase() === q)
    || allMatches.find(match => String(match.match_id || "").toLowerCase() === q)
    || allMatches.find(match => String(match.links && match.links.watch || "").toLowerCase().includes(q))
    || allMatches.find(match => slugify(match.title || "") === q)
    || null;
}

function makeButtonName(key, match) {
  const home = match && match.teams && match.teams.home ? match.teams.home.name : "Team A";
  const away = match && match.teams && match.teams.away ? match.teams.away.name : "Team B";

  const homeShort = shortName(home);
  const awayShort = shortName(away);

  const number = String(key).replace(/\D/g, "");
  const lower = String(key).toLowerCase();

  if (lower.startsWith("android")) return `🔗 Android ${number || ""}`;
  if (lower.startsWith("iphone") || lower.startsWith("ios")) return `📱 iPhone ${number || ""}`;
  if (lower.startsWith("pc")) return `💻 PC ${number || ""}`;
  if (lower.startsWith("smooth")) return `📶 Smooth ${number || ""}`;
  if (lower.startsWith("fhd")) return `4K FHD ${number || ""}`;
  if (lower.startsWith("hd")) return `🎬 HD ${number || ""}`;

  return `▶️ Link ${number || ""}`;
}

function normalizeLinksFromBlock(block, match) {
  if (!block) return [];

  if (Array.isArray(block.events)) {
    return block.events
      .filter(item => item && item.link)
      .map(item => ({
        name: item.name || "Watch Live",
        link: item.link
      }));
  }

  if (Array.isArray(block)) {
    return block
      .filter(item => item && item.link)
      .map(item => ({
        name: item.name || "Watch Live",
        link: item.link
      }));
  }

  if (typeof block === "object") {
    return Object.entries(block)
      .filter(([key, value]) => typeof value === "string" && value.trim())
      .map(([key, value]) => ({
        name: makeButtonName(key, match),
        link: value
      }));
  }

  return [];
}

async function findStreamLinks(streamId, preferredSport) {
  const sportsOrder = preferredSport === "football"
    ? ["football", "cricket"]
    : ["cricket", "football"];

  for (const sport of sportsOrder) {
    try {
      const data = await loadStreamJson(sport);

      if (data && data[streamId]) {
        const links = normalizeLinksFromBlock(data[streamId], currentMatch);
        if (links.length) {
          return { sport, links };
        }
      }

      if (data && Array.isArray(data.events)) {
        const links = normalizeLinksFromBlock(data, currentMatch);
        if (links.length) {
          return { sport, links };
        }
      }
    } catch (e) {
      console.error("Error loading stream for sport:", sport, e);
    }
  }

  return { sport: preferredSport || "cricket", links: [] };
}

function getQualityGroup(name) {
  const n = String(name || "").toLowerCase();

  if (n.includes("android only")) return "Android Only";
  if (n.includes("android")) return "Android Links";
  if (n.includes("iphone") || n.includes("ios")) return "iPhone Links";
  if (n.includes("pc")) return "PC / Desktop Links";
  if (n.includes("smooth")) return "Smooth Stream";
  if (n.includes("fhd")) return "FHD / 4K";
  if (n.includes("hd")) return "HD Links";

  return "Available Links";
}

function renderLinks(links, match) {
  if (!links.length) {
    linksPanel.innerHTML = `
      <div class="error">

        Please check that the stream ID exists in cricket.json or football.json
      </div>
    `;
    return;
  }

  const groups = {};

  links.forEach(item => {
    const group = getQualityGroup(item.name);
    if (!groups[group]) groups[group] = [];
    groups[group].push(item);
  });

  const groupOrder = [
    "Android Only",
    "Android Links",
    "iPhone Links",
    "PC / Desktop Links",
    "Smooth Stream",
    "HD Links",
    "FHD / 4K",
    "Available Links"
  ];

  const home = match.teams && match.teams.home ? match.teams.home.name : "Team A";
  const away = match.teams && match.teams.away ? match.teams.away.name : "Team B";

  let html = `
    <div class="section-title">
      <h2>📺 Live Stream Links</h2>
      <span>${esc(shortName(home))} vs ${esc(shortName(away))}</span>
    </div>

    <p class="note">
      ⚡ Choose any available link below. If one stream is slow or buffering, try another backup link.
    </p>
  `;

  groupOrder.forEach(group => {
    if (!groups[group]) return;

    html += `<div class="group-name">${esc(group)}</div>`;

    groups[group].forEach(item => {
      html += `
        <a class="stream-btn"
           href="${safeUrl(item.link)}"
           target="_blank"
           rel="noopener noreferrer">
          <span>${esc(item.name)}</span>
          <small>🔗 Open</small>
        </a>
      `;
    });
  });

  linksPanel.innerHTML = html;
}

// ===== MAIN INITIALIZATION =====
async function init() {
  if (!queryId) {
    linksPanel.innerHTML = `
      <div class="error">
        ⚠️ <strong>Match ID is missing</strong><br>
        Example: <code>index.html?id=slvsengw</code><br>
        Please provide a valid match ID in the URL.
      </div>
    `;
    infoPanel.innerHTML = "";
    seoPanel.innerHTML = "";
    morePanel.innerHTML = "";
    faqPanel.innerHTML = "";
    return;
  }

  try {
    await loadMatches();

    currentMatch = findMatch(queryId);

    if (currentMatch) {
      currentStreamId = getStreamIdFromMatch(currentMatch) || queryId;
      currentSport = currentMatch.sport || "cricket";
    } else {
      currentStreamId = queryId;
      currentMatch = FALLBACK_MATCH_INFO[currentStreamId] || {
        title: currentStreamId.toUpperCase() + " Live Match",
        stream_id: currentStreamId,
        sport: "cricket",
        teams: {
          home: { name: "Team A", logo: "" },
          away: { name: "Team B", logo: "" }
        },
        match_info: {
          display_time: "Live / Upcoming",
          venue: "Live Sports",
          status: "vs"
        }
      };
      currentSport = currentMatch.sport || "cricket";
    }

    renderHero(currentMatch);

    const result = await findStreamLinks(currentStreamId, currentSport);

    currentSport = result.sport;
    currentMatch.sport = currentMatch.sport || currentSport;

    renderLinks(result.links, currentMatch);
    renderInfo(currentMatch);
    renderSeo(currentMatch);
    renderMoreMatches();
    renderFaq(currentMatch);

  } catch (error) {
    console.error("Initialization error:", error);
    linksPanel.innerHTML = `
      <div class="error">
        ❌ <strong>Failed to load API data</strong><br>
        Please check that matches.json, cricket.json, and football.json are accessible.<br>
        Error: ${esc(error.message)}
      </div>
    `;
    infoPanel.innerHTML = "";
    seoPanel.innerHTML = "";
    morePanel.innerHTML = "";
    faqPanel.innerHTML = "";
  }
}

// Start the app
init();
